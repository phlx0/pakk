[package]
name = "pakk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Create and extract zip, tar.gz and tar.zst archives using every core you have"
authors = ["phlx0"]
license = "GPL-2.0-or-later"
repository = "https://github.com/phlx0/pakk"
readme = "README.md"
keywords = ["zip", "tar", "gzip", "compression", "parallel"]
categories = ["command-line-utilities", "compression"]
exclude = ["/.github", "/bench", "/fuzz"]

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
console = "0.16"
crc32fast = "1.5.4"
ctrlc = { version = "3.5.2", features = ["termination"] }
filetime = "0.2.29"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
ignore = "0.4.34"
indicatif = "0.18.6"
jiff = "0.2.38"
lzma-rust2 = "0.24"
rayon = "1.12.0"
rpassword = "7.5.4"
tar = "0.4.46"
tempfile = "3.27.0"
zip = { version = "9.2.2", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "jiff-02", "legacy-zip", "lzma", "ppmd", "xz", "zstd"] }
zstd = { version = "0.14.3", features = ["zstdmt"] }

[dev-dependencies]
assert_cmd = "2.2.2"
flate2 = "1.1.10"
predicates = "3.1.4"
tar = "0.4.46"
tempfile = "3.27.0"
zstd = "0.14.3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"
xattr = "1"

[target."cfg(unix)".dev-dependencies]
xattr = "1"
